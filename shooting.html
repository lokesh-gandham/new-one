<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Word Blaster: Poem Quest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050515;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    /* Game Screen Container */
    .game-container {
      position: relative;
      width: 850px;
      height: 520px;
      border: 4px solid #00f0ff;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      overflow: hidden;
      background: radial-gradient(circle at center, #111836 0%, #050716 100%);
    }

    /* Starfield Background */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 150px 150px, #fff, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 300px 80px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 450px 350px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 700px 200px, #fff, rgba(0,0,0,0));
      background-size: 800px 500px;
      opacity: 0.6;
    }

    /* HUD Header */
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .level-card {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      padding: 8px 16px;
      color: #00f0ff;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .score-card {
      background: #00f0ff;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Cyber Poem Board */
    .poem-board {
      position: absolute;
      left: 20px;
      top: 75px;
      width: 420px;
      background: rgba(10, 15, 35, 0.9);
      border: 2px solid #ff007f;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
      z-index: 6;
    }

    .poem-title {
      color: #ff007f;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 0, 127, 0.4);
      padding-bottom: 4px;
    }

    .poem-line {
      font-size: 1.05rem;
      color: #e2e8f0;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .blank-slot {
      display: inline-block;
      min-width: 80px;
      height: 26px;
      border-bottom: 2px solid #00f0ff;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      padding: 0 6px;
    }

    .blank-slot.active {
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.2);
      box-shadow: 0 0 8px #ffcc00;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Target Word Asteroids */
    .word-asteroid {
      position: absolute;
      width: 100px;
      height: 48px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #38bdf8;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      cursor: pointer;
      z-index: 4;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .word-asteroid:hover {
      transform: scale(1.08);
      border-color: #ffcc00;
      color: #ffcc00;
    }

    /* Spaceship Cannon */
    .spaceship {
      position: absolute;
      bottom: 20px;
      left: 650px;
      transform: translateX(-50%);
      width: 40px;
      height: 45px;
      z-index: 6;
      transition: left 0.1s ease-out;
    }

    .ship-body {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 36px solid #00f0ff;
      filter: drop-shadow(0 0 8px #00f0ff);
      margin: 0 auto;
    }

    /* Laser Line Beam */
    .laser {
      position: absolute;
      width: 4px;
      background: #ff007f;
      box-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
      z-index: 2;
      display: none;
    }

    /* Dotted Aim Guide */
    .aim-line {
      position: absolute;
      width: 2px;
      border-left: 2px dashed rgba(255, 255, 255, 0.25);
      z-index: 1;
      pointer-events: none;
    }

    /* Dynamic Target Marker Ring */
    .target-marker {
      position: absolute;
      width: 58px;
      height: 58px;
      border: 2px dashed #ff007f;
      border-radius: 50%;
      z-index: 3;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Message Banner */
    .message-pop {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(5, 7, 22, 0.95);
      border: 3px solid #00f0ff;
      color: #00f0ff;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 20px #00f0ff;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="game-container" id="game-area">
    <div class="stars"></div>

    <!-- HUD -->
    <div class="hud">
      <div class="level-card" id="instruction">🚀 BLAST ASTEROID FOR SLOT #1</div>
      <div class="score-card">SCORE: <span id="score">0</span> XP</div>
    </div>

    <!-- Interactive Poem Board -->
    <div class="poem-board">
      <div class="poem-title">⚡ SCIENCE QUEST: SENSE ORGANS</div>
      <div class="poem-line">I have a <span id="slot-0" class="blank-slot active">?</span> to smell,</div>
      <div class="poem-line">The rain and <span id="slot-1" class="blank-slot">?</span> as well.</div>
      <div class="poem-line">I <span id="slot-2" class="blank-slot">?</span> the food so nice,</div>
      <div class="poem-line">And the air, <span id="slot-3" class="blank-slot">?</span> and hasty.</div>
    </div>

    <!-- Spaceship Cannon -->
    <div class="spaceship" id="spaceship">
      <div class="ship-body"></div>
    </div>

    <!-- Laser Beam -->
    <div class="laser" id="laser"></div>

    <!-- Aiming Guide Line -->
    <div class="aim-line" id="aim-line"></div>

    <!-- Lock-on Target Ring -->
    <div class="target-marker" id="target-marker"></div>

    <!-- Spaced-out Target Asteroids (No overlapping with top bar) -->
    <div class="word-asteroid" id="ast-0" style="left: 480px; top: 110px;" onclick="shootTarget(this, 'nose')">nose</div>
    <div class="word-asteroid" id="ast-1" style="left: 680px; top: 180px;" onclick="shootTarget(this, 'flowers')">flowers</div>
    <div class="word-asteroid" id="ast-2" style="left: 500px; top: 260px;" onclick="shootTarget(this, 'smell')">smell</div>
    <div class="word-asteroid" id="ast-3" style="left: 700px; top: 340px;" onclick="shootTarget(this, 'fresh')">fresh</div>

    <!-- Message Pop Up -->
    <div class="message-pop" id="message-box">TARGET DESTROYED! 🚀</div>
  </div>

  <script>
    const spaceship = document.getElementById('spaceship');
    const gameArea = document.getElementById('game-area');
    const laser = document.getElementById('laser');
    const aimLine = document.getElementById('aim-line');
    const targetMarker = document.getElementById('target-marker');
    const messageBox = document.getElementById('message-box');
    const scoreEl = document.getElementById('score');

    let currentStep = 0;
    let score = 0;
    let isFiring = false;

    const sequence = [
      { targetWord: "nose", slotId: "slot-0" },
      { targetWord: "flowers", slotId: "slot-1" },
      { targetWord: "smell", slotId: "slot-2" },
      { targetWord: "fresh", slotId: "slot-3" }
    ];

    // Mouse aiming inside the right column bounds
    gameArea.addEventListener('mousemove', (e) => {
      if (isFiring) return;
      const rect = gameArea.getBoundingClientRect();
      let mouseX = e.clientX - rect.left;

      if (mouseX < 470) mouseX = 470;
      if (mouseX > 810) mouseX = 810;

      spaceship.style.left = mouseX + 'px';
      updateAimLine(mouseX);
    });

    function updateAimLine(shipX) {
      aimLine.style.left = shipX + 'px';
      aimLine.style.top = '70px';
      aimLine.style.height = (520 - 70 - 45) + 'px';
    }

    function shootTarget(asteroidEl, word) {
      if (isFiring || currentStep >= sequence.length) return;
      isFiring = true;

      const astRect = asteroidEl.getBoundingClientRect();
      const gameRect = gameArea.getBoundingClientRect();

      // Target Center Points
      const targetCenterX = (astRect.left + astRect.width / 2) - gameRect.left;
      const targetCenterY = (astRect.top + astRect.height / 2) - gameRect.top;

      // Lock Cannon to Target X
      spaceship.style.left = targetCenterX + 'px';
      updateAimLine(targetCenterX);

      // Lock-on Ring
      targetMarker.style.left = targetCenterX + 'px';
      targetMarker.style.top = targetCenterY + 'px';
      targetMarker.style.display = 'block';

      // Laser Beam (Stops directly at asteroid center)
      const shipTopY = 520 - 55;
      const laserHeight = shipTopY - targetCenterY;

      laser.style.left = (targetCenterX - 2) + 'px';
      laser.style.top = targetCenterY + 'px';
      laser.style.height = laserHeight + 'px';
      laser.style.display = 'block';

      setTimeout(() => {
        laser.style.display = 'none';
        targetMarker.style.display = 'none';
        isFiring = false;

        const activeStep = sequence[currentStep];

        if (word === activeStep.targetWord) {
          score += 100;
          scoreEl.innerText = score;

          const slotEl = document.getElementById(activeStep.slotId);
          slotEl.innerText = word;
          slotEl.classList.remove('active');

          asteroidEl.style.display = 'none';
          showMessage(`⚡ "${word.toUpperCase()}" SLOTTED!`);

          currentStep++;

          if (currentStep < sequence.length) {
            const nextSlot = document.getElementById(sequence[currentStep].slotId);
            nextSlot.classList.add('active');
            document.getElementById('instruction').innerText = `🚀 BLAST ASTEROID FOR SLOT #${currentStep + 1}`;
          } else {
            document.getElementById('instruction').innerText = "🏆 MISSION COMPLETE!";
          }
        } else {
          showMessage("❌ WRONG ASTEROID FOR THIS SLOT!");
        }
      }, 250);
    }

    function showMessage(text) {
      messageBox.innerText = text;
      messageBox.style.display = "block";
      setTimeout(() => {
        messageBox.style.display = "none";
      }, 1400);
    }
  </script>
</body>
</html>
