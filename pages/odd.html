<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jungle Launcher — Sense Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/safari.css">
<script src="../js/font-guard.js"></script>
</head>
<body>
<div id="bgScene" aria-hidden="true"></div>
<div class="vine-left" aria-hidden="true"></div>
<div class="vine-right" aria-hidden="true"></div>

<div class="app" id="main">
  <section class="screen active game-screen" style="height:100vh;overflow:hidden;">
    <div class="gp-hud">
      <div class="side"><button class="gp-back" data-back>Menu</button></div>
      <div class="side">
        <div class="gp-chip score-chip">⭐ <span id="oddScore">0</span></div>
        <div class="gp-chip combo-chip">🔥 <span id="oddCombo">x0</span></div>
        <div class="gp-chip" id="oddCount">Q 1/6</div>
        <div class="gp-chip timer-chip" id="oddTimer">⏰ 2:00</div>
      </div>
      <div class="side"><button class="sound-toggle" data-sound-toggle>🔊</button></div>
    </div>
    <div class="game-wrap">
      <div class="game-title-row"><h2>🎯 Jungle Launcher</h2><p>Aim and hit the odd one out!</p></div>
      <div class="odd-progress" id="oddProgress"></div>
      <div class="odd-stage" id="oddStage">
        <canvas id="oddCanvas"></canvas>
        <div class="odd-hud-overlay">
          <div class="odd-question" id="oddQuestion"></div>
        </div>
        <div class="odd-result-popup" id="oddResultPopup"></div>
        <div class="odd-instruction" id="oddInstruction">Drag the bird back to aim, then release to launch!</div>
        <div class="game-result-overlay" id="gameResultOverlay">
          <div class="game-result-card">
            <div class="game-result-emoji"></div>
            <div class="game-result-title"></div>
            <div class="game-result-score"></div>
            <div class="game-result-buttons">
              <button class="game-result-btn primary" data-play-again>▶ Play Again</button>
              <button class="game-result-btn secondary" data-go-menu>🏠 Menu</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="float-banner" id="floatBanner"></div>

<script src="../js/safari-common.js"></script>
<script src="../js/odd.js"></script>
</body>
</html>
