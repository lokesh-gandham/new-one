<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sense Crossword — Sense Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/safari.css">
</head>
<body>
<div id="bgScene" aria-hidden="true"></div>
<div class="vine-left" aria-hidden="true"></div>
<div class="vine-right" aria-hidden="true"></div>

<div class="app" id="main">
  <section class="screen active game-screen">
    <div class="gp-hud">
      <div class="side"><button class="gp-back" data-back>Menu</button></div>
      <div class="side">
        <div class="gp-chip score-chip">⭐ <span id="crossScore">0</span></div>
        <div class="gp-chip" id="crossCount">0/5 Words</div>
      </div>
      <div class="side"><button class="sound-toggle" data-sound-toggle>🔊</button></div>
    </div>
    <div class="game-wrap">
      <div class="game-title-row"><h2>🧩 Sense Crossword</h2><p>Use the pictures as clues to complete the crossword!</p></div>
      <div class="crossword-stage" id="crosswordStage"></div>
    </div>
  </section>
</div>

<div class="float-banner" id="floatBanner"></div>

<script src="../js/safari-common.js"></script>
<script src="../js/crossword.js"></script>
</body>
</html>
